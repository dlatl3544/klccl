<div class="layout single"><main><div class="crumb"><a href="../">KLCCL</a> › <b>찾기</b></div><div class="page"><h1>찾기</h1><p class="lead">저자, 저작, 설교 제목, 성경 구절로 찾습니다. 성경 구절은 "욥 16:2"나 "욥기 16"처럼 적으면 그 장으로 갑니다.</p><input class="search big" id="sq" type="search" placeholder="예: 욥 16:2, 위로자, 칼빈" autofocus><div id="sr" class="results"></div><p class="mini">지금은 제목과 구절 색인으로 찾습니다. 본문 전체 찾기는 번역이 늘어나면 더합니다.</p><script>window.KLCCL_SEARCH=[{"t": "고대 교회", "s": "저자", "u": "ecumenical/"}, {"t": "존 칼빈", "s": "저자", "u": "calvin/"}, {"t": "개혁교회", "s": "저자", "u": "reformed/"}, {"t": "클라스 스킬더", "s": "저자", "u": "schilder/"}, {"t": "고대 교회, 「고대 교회 신경」", "s": "저작", "u": "ecumenical/ancient-creeds/", "x": "사도신경, 니케아-콘스탄티노플 신경(동방 공인본과 서방 공인본), 칼케돈 신앙 정의, 아타나시우스 신경. Schaff 판의 라틴어·그리스어 본문과 조항 단위로 나란히 읽습니다."}, {"t": "「고대 교회 신경」 제1편 사도신경", "s": "고대 교회 ·  · Schaff 2:45", "u": "ecumenical/ancient-creeds/001.html"}, {"t": "「고대 교회 신경」 제2편 니케아-콘스탄티노플 신경 (동방 공인본, 381년)", "s": "고대 교회 ·  · Schaff 2:57–58", "u": "ecumenical/ancient-creeds/002.html"}, {"t": "「고대 교회 신경」 제3편 니케아-콘스탄티노플 신경 (서방 공인본)", "s": "고대 교회 ·  · Schaff 2:58–59", "u": "ecumenical/ancient-creeds/003.html"}, {"t": "「고대 교회 신경」 제4편 칼케돈 신앙 정의 (451년)", "s": "고대 교회 ·  · Schaff 2:62–63", "u": "ecumenical/ancient-creeds/004.html"}, {"t": "「고대 교회 신경」 제5편 아타나시우스 신경", "s": "고대 교회 ·  · Schaff 2:66–70", "u": "ecumenical/ancient-creeds/005.html"}, {"t": "개혁교회, 「제1 스위스 신앙고백」", "s": "저작", "u": "reformed/first-helvetic-confession/", "x": "1536년 바젤에 모인 스위스 개혁교회 신학자들(불링거, 그리나이우스, 미코니우스 등)이 작성한 신앙고백 28조. Schaff 판의 라틴어 본문에서 옮기고, 레오 유트의 독일어판(고지독일어)을 원문 칸에 함께 실어 조 단위로 나란히 읽습니다."}, {"t": "「제1 스위스 신앙고백」 제1편 제1 스위스 신앙고백", "s": "개혁교회 ·  · Schaff 3:211–231", "u": "reformed/first-helvetic-confession/001.html"}, {"t": "개혁교회, 「스위스 일치 신조」", "s": "저작", "u": "reformed/helvetic-consensus/", "x": "1675년 하이데거, 튀레틴, 게를러가 소뮈르 학파의 가르침에 맞서 작성한 스위스 개혁교회의 일치 신조. 머리말과 법규 26조를 Müller 판(1903)의 라틴어 본문과 조항 단위로 나란히 읽습니다."}, {"t": "「스위스 일치 신조」 제1편 머리말", "s": "개혁교회 ·  · Müller 861–862", "u": "reformed/helvetic-consensus/001.html"}, {"t": "「스위스 일치 신조」 제2편 법규 26조", "s": "개혁교회 ·  · Müller 862–870", "u": "reformed/helvetic-consensus/002.html"}, {"t": "개혁교회, 「스코틀랜드 신앙고백」", "s": "저작", "u": "reformed/scots-confession/", "x": "1560년 존 녹스 등이 작성해 스코틀랜드 의회가 승인한 신앙고백. 제목과 머리말, 본문 25조를 Schaff 판(Dunlop 판 재인쇄)의 옛 스코트어 원문과 조항 단위로 나란히 읽습니다."}, {"t": "「스코틀랜드 신앙고백」 제1편 제목과 머리말", "s": "개혁교회 ·  · Schaff 3:437–439", "u": "reformed/scots-confession/001.html"}, {"t": "「스코틀랜드 신앙고백」 제2편 본문 25조", "s": "개혁교회 ·  · Schaff 3:439–479", "u": "reformed/scots-confession/002.html"}, {"t": "개혁교회, 「제2 스위스 신앙고백」", "s": "저작", "u": "reformed/second-helvetic-confession/", "x": "하인리히 불링거가 쓰고 1566년 스위스 개혁교회들이 채택한 신앙고백 30장. 서문과 황제 칙령, 다마수스 신경, 본문 30장을 Schaff 판의 라틴어 본문과 문단 단위로 나란히 읽습니다."}, {"t": "「제2 스위스 신앙고백」 제1편 서문, 황제 칙령, 다마수스 신경", "s": "개혁교회 ·  · Schaff 3:234–237", "u": "reformed/second-helvetic-confession/001.html"}, {"t": "「제2 스위스 신앙고백」 제2편 제1장 성경, 곧 하나님의 참된 말씀에 관하여", "s": "개혁교회 ·  · Schaff 3:237–239", "u": "reformed/second-helvetic-confession/002.html"}, {"t": "「제2 스위스 신앙고백」 제3편 제2장 거룩한 성경의 해석과 교부들과 공의회들과 전통들에 관하여", "s": "개혁교회 ·  · Schaff 3:239–240", "u": "reformed/second-helvetic-confession/003.html"}, {"t": "「제2 스위스 신앙고백」 제4편 제3장 하나님과 그분의 하나 되심과 삼위일체에 관하여", "s": "개혁교회 ·  · Schaff 3:240–241", "u": "reformed/second-helvetic-confession/004.html"}, {"t": "「제2 스위스 신앙고백」 제5편 제4장 하나님과 그리스도와 성인들의 우상, 곧 형상에 관하여", "s": "개혁교회 ·  · Schaff 3:241–243", "u": "reformed/second-helvetic-confession/005.html"}, {"t": "「제2 스위스 신앙고백」 제6편 제5장 유일하신 중보자 예수 그리스도를 통하여 하나님께 드리는 경배와 예배와 기도에 관하여", "s": "개혁교회 ·  · Schaff 3:243–244", "u": "reformed/second-helvetic-confession/006.html"}, {"t": "「제2 스위스 신앙고백」 제7편 제6장 하나님의 섭리에 관하여", "s": "개혁교회 ·  · Schaff 3:244–246", "u": "reformed/second-helvetic-confession/007.html"}, {"t": "「제2 스위스 신앙고백」 제8편 제7장 만물의 창조와 천사와 마귀와 사람에 관하여", "s": "개혁교회 ·  · Schaff 3:246–247", "u": "reformed/second-helvetic-confession/008.html"}, {"t": "「제2 스위스 신앙고백」 제9편 제8장 사람의 타락과 죄와 죄의 원인에 관하여", "s": "
